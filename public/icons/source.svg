<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision">
  <defs>

    <!-- Subtle warm centre glow -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="52%">
      <stop offset="0%"   stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>

    <!-- Gold shimmer on checkmark -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E2C97E"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A8893A"/>
    </linearGradient>

    <!-- Soft drop shadow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle outer ring glow -->
    <filter id="ringGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── Background (solid — required for iOS, no alpha) ─────────────────── -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- ── Safe zone reference (204×204, centred): 154,154 → 358,358 ───────── -->
  <!-- All critical marks stay within this zone for maskable icon safety     -->

  <!-- ── Outer decorative ring ─────────────────────────────────────────────── -->
  <circle
    cx="256" cy="250" r="92"
    fill="none"
    stroke="#C9A84C"
    stroke-width="1.5"
    opacity="0.22"
    filter="url(#ringGlow)"
  />

  <!-- ── Inner hairline ring ────────────────────────────────────────────────── -->
  <circle
    cx="256" cy="250" r="72"
    fill="none"
    stroke="#C9A84C"
    stroke-width="0.75"
    opacity="0.10"
  />

  <!-- ── Four quarter-arc ticks (clock face, ultra subtle) ─────────────────── -->
  <g stroke="#C9A84C" stroke-width="2" stroke-linecap="round" opacity="0.10">
    <line x1="256" y1="155" x2="256" y2="165"/>
    <line x1="351" y1="250" x2="341" y2="250"/>
    <line x1="256" y1="345" x2="256" y2="335"/>
    <line x1="161" y1="250" x2="171" y2="250"/>
  </g>

  <!-- ── Checkmark (primary mark) ─────────────────────────────────────────── -->
  <!--   Start  (220, 252)  →  Corner (247, 281)  →  End (302, 215)          -->
  <polyline
    points="220,252 247,281 302,215"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- ── Purple terminal accent dot (end of checkmark) ───────────────────── -->
  <circle cx="302" cy="215" r="6" fill="#9B7EC8" opacity="0.80"/>

  <!-- ── Hairline separator ─────────────────────────────────────────────────── -->
  <line
    x1="222" y1="304" x2="290" y2="304"
    stroke="#C9A84C"
    stroke-width="0.75"
    opacity="0.25"
    stroke-linecap="round"
  />

  <!-- ── Wordmark ──────────────────────────────────────────────────────────── -->
  <text
    x="256" y="330"
    text-anchor="middle"
    font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="20"
    font-weight="300"
    letter-spacing="9"
    fill="#C9A84C"
    opacity="0.72"
    x-transform="translate(-4,0)"
  >DYDTT</text>

</svg>
